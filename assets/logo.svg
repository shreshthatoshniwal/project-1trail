<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 50" width="170" height="50">
    <!-- Background is transparent -->
    <!-- Fountain Pen Nib with Eye -->
    <g transform="translate(6, 4)">
        <!-- Pen Grip / Top Bar -->
        <rect x="8" y="2" width="16" height="4" rx="1" fill="#0d233a" />
        <rect x="7" y="7" width="18" height="2.5" rx="0.5" fill="#1b3b5c" />
        
        <!-- Pen Body & Nib Pointing Down -->
        <path d="M 6 10 L 26 10 L 23 20 L 16 38 L 9 20 Z" fill="#0d233a" />
        
        <!-- Nib Center Split Line -->
        <line x1="16" y1="26" x2="16" y2="38" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
        
        <!-- Eye in the Nib -->
        <!-- Eye Contour -->
        <path d="M 10 18 Q 16 11 22 18 Q 16 25 10 18 Z" fill="#ffffff" />
        <!-- Iris -->
        <circle cx="16" cy="18" r="3.2" fill="#0d233a" />
        <!-- Pupil Reflection -->
        <circle cx="15.2" cy="17.2" r="1" fill="#ffffff" />
    </g>

    <!-- Text: InkSight -->
    <text x="42" y="24" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="17" font-weight="700" fill="#0d233a" letter-spacing="0.5">InkSight</text>

    <!-- Background Barcode / Hatch Lines for 'PUBLICATION' -->
    <g opacity="0.35">
        <line x1="43" y1="28" x2="43" y2="42" stroke="#0d233a" stroke-width="0.8" />
        <line x1="46" y1="28" x2="46" y2="42" stroke="#0d233a" stroke-width="0.6" />
        <line x1="49" y1="28" x2="49" y2="42" stroke="#0d233a" stroke-width="1.2" />
        <line x1="53" y1="28" x2="53" y2="42" stroke="#0d233a" stroke-width="0.7" />
        <line x1="57" y1="28" x2="57" y2="42" stroke="#0d233a" stroke-width="1.4" />
        <line x1="61" y1="28" x2="61" y2="42" stroke="#0d233a" stroke-width="0.6" />
        <line x1="65" y1="28" x2="65" y2="42" stroke="#0d233a" stroke-width="1.1" />
        <line x1="69" y1="28" x2="69" y2="42" stroke="#0d233a" stroke-width="0.8" />
        <line x1="73" y1="28" x2="73" y2="42" stroke="#0d233a" stroke-width="1.5" />
        <line x1="77" y1="28" x2="77" y2="42" stroke="#0d233a" stroke-width="0.6" />
        <line x1="81" y1="28" x2="81" y2="42" stroke="#0d233a" stroke-width="1.2" />
        <line x1="85" y1="28" x2="85" y2="42" stroke="#0d233a" stroke-width="0.9" />
        <line x1="89" y1="28" x2="89" y2="42" stroke="#0d233a" stroke-width="1.4" />
        <line x1="93" y1="28" x2="93" y2="42" stroke="#0d233a" stroke-width="0.6" />
        <line x1="97" y1="28" x2="97" y2="42" stroke="#0d233a" stroke-width="1.2" />
        <line x1="101" y1="28" x2="101" y2="42" stroke="#0d233a" stroke-width="0.8" />
        <line x1="105" y1="28" x2="105" y2="42" stroke="#0d233a" stroke-width="1.3" />
        <line x1="109" y1="28" x2="109" y2="42" stroke="#0d233a" stroke-width="0.7" />
        <line x1="113" y1="28" x2="113" y2="42" stroke="#0d233a" stroke-width="1.2" />
        <line x1="117" y1="28" x2="117" y2="42" stroke="#0d233a" stroke-width="0.9" />
        <line x1="121" y1="28" x2="121" y2="42" stroke="#0d233a" stroke-width="1.4" />
        <line x1="125" y1="28" x2="125" y2="42" stroke="#0d233a" stroke-width="0.7" />
        <line x1="129" y1="28" x2="129" y2="42" stroke="#0d233a" stroke-width="1.1" />
        <line x1="133" y1="28" x2="133" y2="42" stroke="#0d233a" stroke-width="0.6" />
        <line x1="137" y1="28" x2="137" y2="42" stroke="#0d233a" stroke-width="1.3" />
    </g>

    <!-- Text: PUBLICATION -->
    <text x="43" y="38" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="8" font-weight="800" fill="#0d233a" letter-spacing="2.6">PUBLICATION</text>
</svg>

